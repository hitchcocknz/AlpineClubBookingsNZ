name: E2E

# Playwright browser E2E suite for the Critical journeys in
# docs/END_TO_END_TEST_MATRIX.md, run against the staging compose stack with
# the base + demo seeds. This is a blocking gate: a red run fails the workflow
# (promoted from advisory in #1315 after a stable green window on main).
#
# The Stripe payment specs skip unless the STRIPE_TEST_SECRET_KEY and
# STRIPE_TEST_PUBLISHABLE_KEY repository secrets hold genuine Stripe
# *test-mode* keys (sk_test_… / pk_test_…). Never store live keys there.

on:
  # `epic/**` is here for the integration-branch model (#3002): an epic's
  # children target `epic/<issue>-<slug>` rather than `main`, so without this
  # they would get no CI at all and the only substitute was a throwaway probe
  # pull request against `main` — which tests the commit OUTSIDE its stack and
  # so can pass while the stacked integration is broken. `push` is included as
  # well so the integration branch is re-checked after each child merges into
  # it, rather than surfacing breakage at the epic's final merge.
  #
  # This widens WHEN the existing jobs run and adds no new status context, so
  # `main`'s branch protection is untouched. See
  # docs/agents/EPIC_PLAYBOOK.md -> "An epic reaches `main` as ONE merge".
  pull_request:
    branches:
      - main
      - "epic/**"
  push:
    branches:
      - main
      - "epic/**"

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs only on pull requests (a new push to the same PR
  # supersedes the previous run). Pushes to main must NOT cancel each other:
  # every merge needs its own browser verdict, so main-push runs queue and each
  # completes instead of being voided (finding F13 / #1373 — cancel-in-progress
  # previously voided most main-push E2E runs).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # #4397: one image build and one seeded database per run, shared by every
  # runner job below, instead of each job building the image (10 min) and
  # running the demo seed (5 min) for itself. Both run in parallel. Artifacts
  # rather than GHCR, because a fork's pull request cannot push packages.
  # Neither is a required check: a failure here skips the runner jobs, and the
  # required gates at the end then fail closed on the skipped runners.
  e2e-image:
    name: E2E app image
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          # Two commits: a pull request's merge commit and its base parent,
          # which `e2e-scope.mjs` diffs to decide whether the suite can move.
          fetch-depth: 2

      # #4397: a STEP, never a job-level `if:` - the job still reports a real
      # result. The heavy steps below skip only on an explicit `needed=false`
      # (a pull request whose every changed file is docs, a unit test or an
      # agent note); a missing answer runs them. A push always runs.
      - name: Decide whether this change needs the browser suite
        id: scope
        run: node scripts/ci/e2e-scope.mjs

      - name: Set up Docker Buildx
        if: steps.scope.outputs.needed != 'false'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      # A hosted runner's ~14 GB no longer fits this image comfortably
      # (#3424); the script explains what it removes and why nothing it does
      # may fail the build.
      - name: Reclaim runner disk before building
        if: steps.scope.outputs.needed != 'false'
        run: bash scripts/ci/reclaim-runner-disk.sh

      # The same cache scopes the publish job uses, so a run reuses main's
      # layers instead of rebuilding Next.js from nothing.
      - name: Build app image
        if: steps.scope.outputs.needed != 'false'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: tacbookings-e2e-app:ci
          # RELEASE_ID (#2352 D1) gives the staging stack a real per-release CSP
          # nonce, so the static-CMS spec asserts the same nonce on two requests
          # rather than passing on the per-process fallback. Stated here rather
          # than inside the block below: every line of that block is passed to
          # the builder verbatim, so a `#` comment there becomes a build arg.
          build-args: |
            NEXT_PUBLIC_SENTRY_DSN=
            RELEASE_ID=${{ github.sha }}
          cache-from: |
            type=gha,scope=alpineclubbookingsnz-app
            type=gha,scope=alpineclubbookingsnz-e2e
          cache-to: type=gha,mode=max,scope=alpineclubbookingsnz-e2e

      # `shell: bash` runs with pipefail, so a failed `docker save` fails here
      # rather than uploading a truncated archive.
      - name: Save the app image
        if: steps.scope.outputs.needed != 'false'
        shell: bash
        run: |
          mkdir -p .artifacts/e2e-image
          docker save tacbookings-e2e-app:ci | zstd -T0 -3 -q -o .artifacts/e2e-image/app-image.tar.zst
          ls -lh .artifacts/e2e-image

      - name: Upload the app image
        if: steps.scope.outputs.needed != 'false'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-app-image-${{ github.run_id }}
          path: .artifacts/e2e-image/app-image.tar.zst
          retention-days: 1
          compression-level: 0
          overwrite: true
          if-no-files-found: error

  # Deliberately NO secrets in this job: its dump is an artifact anyone can
  # download from a public repository. Credentials are seeded on each runner,
  # after the restore (`scripts/e2e-stack.sh` prepare); a contract test
  # (require-test-shards.test.mjs) keeps `secrets.` out of this job.
  e2e-db:
    name: E2E seeded database
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          # Two commits: a pull request's merge commit and its base parent,
          # which `e2e-scope.mjs` diffs to decide whether the suite can move.
          fetch-depth: 2

      # #4397: a STEP, never a job-level `if:` - the job still reports a real
      # result. The heavy steps below skip only on an explicit `needed=false`
      # (a pull request whose every changed file is docs, a unit test or an
      # agent note); a missing answer runs them. A push always runs.
      - name: Decide whether this change needs the browser suite
        id: scope
        run: node scripts/ci/e2e-scope.mjs

      # The pnpm version comes from `packageManager` in package.json (#3673).
      - name: Set up pnpm
        if: steps.scope.outputs.needed != 'false'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        if: steps.scope.outputs.needed != 'false'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        if: steps.scope.outputs.needed != 'false'
        run: pnpm install --frozen-lockfile

      - name: Write staging env file
        if: steps.scope.outputs.needed != 'false'
        run: bash scripts/ci/write-e2e-staging-env.sh

      # Migrate, run the single-lodge seeds and dump the result with the club
      # day it was seeded for. Each runner restores it in seconds.
      - name: Seed and dump the database
        if: steps.scope.outputs.needed != 'false'
        run: bash scripts/e2e-stack.sh snapshot .artifacts/e2e-db/e2e-db.dump

      - name: Upload the seeded database
        if: steps.scope.outputs.needed != 'false'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-seeded-db-${{ github.run_id }}
          path: .artifacts/e2e-db/
          retention-days: 1
          overwrite: true
          if-no-files-found: error

      - name: Tear down stack
        if: always() && steps.scope.outputs.needed != 'false'
        run: bash scripts/e2e-stack.sh down

  # Every browser run, as one matrix so the steps exist once: the
  # single-lodge suite split across machines (a third of the `chromium` spec
  # files each, `E2E_SHARD`; scripts/ci/e2e-spec-shard.mjs), and the
  # multi-lodge project (#1568, blocking since #1655) on the same database
  # plus a SECOND active lodge, on its own stack so lodge B never reaches the
  # single-lodge shards. Workers stay at one per runner: specs share seeded
  # personas and assert on lodge capacity, and each runner has a database of
  # its own. Not required checks: the gates below are.
  e2e-runner:
    name: ${{ matrix.name }}
    needs: [e2e-image, e2e-db]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "E2E shard (1/3)"
            shard: "1/3"
            multi_lodge: ""
            playwright_args: ""
            report: "shard-1"
          - name: "E2E shard (2/3)"
            shard: "2/3"
            multi_lodge: ""
            playwright_args: ""
            report: "shard-2"
          - name: "E2E shard (3/3)"
            shard: "3/3"
            multi_lodge: ""
            playwright_args: ""
            report: "shard-3"
          - name: "E2E multi-lodge run (1/1)"
            shard: ""
            multi_lodge: "1"
            playwright_args: "--project=multi-lodge"
            report: "multi-lodge"
    env:
      STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
      STRIPE_TEST_PUBLISHABLE_KEY: ${{ secrets.STRIPE_TEST_PUBLISHABLE_KEY }}
      APP_IMAGE: tacbookings-e2e-app:ci
      E2E_SHARD: ${{ matrix.shard }}
      # Provisions lodge B on top of the restored database and adds the
      # `multi-lodge` project to the Playwright config for the run.
      E2E_MULTI_LODGE: ${{ matrix.multi_lodge }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          # Two commits: a pull request's merge commit and its base parent,
          # which `e2e-scope.mjs` diffs to decide whether the suite can move.
          fetch-depth: 2

      # #4397: a STEP, never a job-level `if:` - the job still reports a real
      # result. The heavy steps below skip only on an explicit `needed=false`
      # (a pull request whose every changed file is docs, a unit test or an
      # agent note); a missing answer runs them. A push always runs.
      - name: Decide whether this change needs the browser suite
        id: scope
        run: node scripts/ci/e2e-scope.mjs

      # The pnpm version comes from `packageManager` in package.json (#3673).
      - name: Set up pnpm
        if: steps.scope.outputs.needed != 'false'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        if: steps.scope.outputs.needed != 'false'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        if: steps.scope.outputs.needed != 'false'
        run: pnpm install --frozen-lockfile

      # Before loading the image and preparing the stack: finding the browser
      # broken afterwards wastes both. Cached, so usually seconds.
      - name: Install Playwright browsers
        if: steps.scope.outputs.needed != 'false'
        uses: ./.github/actions/playwright-browsers

      # One home for the stack's env file (INV-SSOT), shared by every E2E job
      # here and `e2e-rollover-proof.yml`. Deterministic, so the restored
      # database signs in and decrypts exactly as it was seeded.
      - name: Write staging env file
        if: steps.scope.outputs.needed != 'false'
        run: bash scripts/ci/write-e2e-staging-env.sh

      - name: Reclaim runner disk before loading the image
        if: steps.scope.outputs.needed != 'false'
        run: bash scripts/ci/reclaim-runner-disk.sh

      - name: Download the app image
        if: steps.scope.outputs.needed != 'false'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-app-image-${{ github.run_id }}
          path: .artifacts/e2e-inputs

      - name: Download the seeded database
        if: steps.scope.outputs.needed != 'false'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-seeded-db-${{ github.run_id }}
          path: .artifacts/e2e-inputs

      - name: Load the app image
        if: steps.scope.outputs.needed != 'false'
        shell: bash
        run: zstd -dc .artifacts/e2e-inputs/app-image.tar.zst | docker load

      - name: Prepare the stack from the seeded database
        if: steps.scope.outputs.needed != 'false'
        env:
          E2E_SKIP_APP_BUILD: "1"
          E2E_DB_SNAPSHOT: .artifacts/e2e-inputs/e2e-db.dump
        run: bash scripts/e2e-stack.sh prepare

      - name: Run Playwright
        if: steps.scope.outputs.needed != 'false'
        run: bash scripts/e2e-stack.sh run ${{ matrix.playwright_args }}

      - name: Upload Playwright report
        if: always() && steps.scope.outputs.needed != 'false'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-${{ github.run_id }}-${{ matrix.report }}
          path: playwright-report/
          if-no-files-found: ignore

      - name: Show app logs on failure
        if: failure() && steps.scope.outputs.needed != 'false'
        run: |
          docker compose --env-file .env.staging -p tacbookings-staging \
            -f docker-compose.yml -f docker-compose.staging.yml logs app | tail -200

      - name: Tear down stack
        if: always() && steps.scope.outputs.needed != 'false'
        run: bash scripts/e2e-stack.sh down

  # Required check (branch protection). It no longer runs the suite itself: it
  # waits for the three shard runners in this run attempt and passes only if
  # every one of them passed.
  playwright:
    name: Playwright E2E
    runs-on: ubuntu-latest
    # Longer than the slowest chain it waits for: image (40) + runner (45),
    # plus queueing.
    timeout-minutes: 100
    permissions:
      contents: read
      actions: read # poll this run attempt's own runner jobs
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      # A STEP in the required job, not a `needs:` edge: a skipped required
      # job would satisfy branch protection. The script fails on a missing,
      # duplicate, skipped, cancelled or failed runner and times out rather
      # than going vacuously green (the #3431 gate, shared with `verify`).
      - name: Require every runner job to pass
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ci/require-test-shards.mjs --label "E2E shard" --count 3 --max-wait-minutes 95 --upstream "E2E app image" --upstream "E2E seeded database"

  # Required check (branch protection) for the multi-lodge runner, gated the
  # same way.
  multi-lodge:
    name: E2E multi-lodge
    runs-on: ubuntu-latest
    # Longer than the slowest chain it waits for: image (40) + runner (45),
    # plus queueing.
    timeout-minutes: 100
    permissions:
      contents: read
      actions: read # poll this run attempt's own runner jobs
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      # A STEP in the required job, not a `needs:` edge: a skipped required
      # job would satisfy branch protection. The script fails on a missing,
      # duplicate, skipped, cancelled or failed runner and times out rather
      # than going vacuously green (the #3431 gate, shared with `verify`).
      - name: Require every runner job to pass
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ci/require-test-shards.mjs --label "E2E multi-lodge run" --count 1 --max-wait-minutes 95 --upstream "E2E app image" --upstream "E2E seeded database"
